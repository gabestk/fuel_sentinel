buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Plugins antigos (ex.: flutter_bluetooth_serial 0.4.0) não declaram o "namespace"
// exigido pelo Android Gradle Plugin 8. Usa o "group" do plugin como namespace.
subprojects {
    plugins.withId("com.android.library") {
        if (project.android.namespace == null) {
            project.android.namespace = project.group.toString()
        }
    }
}
subprojects {
     afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 36
                buildToolsVersion "36.0.0"
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
